<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/water.css@2/out/water.min.css">

  <style>
    #go {
      transition: background-color 0.2s, border-color 0.2s;
    }
    .btn-connected {
      background-color: #dc3545 !important;
      border-color: #dc3545 !important;
      color: #ffffff !important;
    }
    .btn-disconnected {
      background-color: #2ea44f !important;
      border-color: #2ea44f !important;
      color: #ffffff !important;
    }
    .btn-connecting {
      background-color: #d97706 !important;
      border-color: #d97706 !important;
      color: #ffffff !important;
    }
    .time-range-btn {
      padding: 3px 8px;
      font-size: 0.8em;
      margin: 0;
      cursor: pointer;
    }
    .time-range-btn.active {
      background-color: #0366d6 !important;
      border-color: #0366d6 !important;
      color: #ffffff !important;
    }
    #graph {
      border-radius: 8px;
      overflow: hidden;
    }
  </style>

  <title>USB BLE Power Meter</title>
</head>

<body>
  <h1>USB BLE Power Meter</h1>
  <h2 id="warnBlock">Your Browser does not appear to support WebBluetooth</h2>
  <p>View <a href="https://github.com/ZDAVanO/usb-meter/blob/main/README.md">README</a> for more information.</p>

  <hr>

  <button id="go" class="btn-disconnected" onclick="Go()">Connect</button>
  <button id="pause" onclick="Pause()">Pause</button>
  <button id="resetMeter" onclick="ResetMeter()">Reset Meter</button>
  <button id="clearData" onclick="ClearData()">Clear Graph</button>
  <button id="save" onclick="Save()">Save CSV</button>

  <table>
    <thead>
      <tr>
        <th>Measurement</th>
        <th>Value</th>
        <th>Stats (min/max/average)</th>
      </tr>
    </thead>
    <tbody>
      <tr style="color: #ffd700">
        <td>Voltage</td>
        <td id="voltage"></td>
        <td id="voltage_stats"></td>
      </tr>
      <tr style="color: #4ade80">
        <td>Current</td>
        <td id="current"></td>
        <td id="current_stats"></td>
      </tr>
      <tr style="color: #ff5252">
        <td>Power</td>
        <td id="power"></td>
        <td id="power_stats"></td>
      </tr>
      <tr style="color: #c084fc">
        <td>Energy</td>
        <td id="energy"></td>
        <td id="energy_stats"></td>
      </tr>
      <tr style="color: #38bdf8">
        <td>Capacity</td>
        <td id="capacity"></td>
        <td id="capacity_stats"></td>
      </tr>
      <tr style="color: #2d6eff">
        <td>Resistance</td>
        <td id="resistance"></td>
        <td id="resistance_stats"></td>
      </tr>
      <tr style="color: #2dd4bf">
        <td>Temperature</td>
        <td id="temperature"></td>
        <td id="temperature_stats"></td>
      </tr>
      <tr style="color: #86efac">
        <td>USB Data -/+</td>
        <td id="usb"></td>
        <td id="usb_stats"></td>
      </tr>
      <tr style="color: #f1f5f9">
        <td>Time</td>
        <td id="time">000:00:00</td>
        <td id="time_stats">Samples: 0</td>
      </tr>
    </tbody>
  </table>

  <hr>

    <div style="display: flex; align-items: center; justify-content: flex-end; gap: 6px; margin-bottom: 8px;">
    <span style="font-size: 0.85em; opacity: 0.8; margin-right: 4px;">Window:</span>
    <button class="time-range-btn active" data-range="0" onclick="setTimeWindow(0)">All</button>
    <button class="time-range-btn" data-range="60" onclick="setTimeWindow(60)">1m</button>
    <button class="time-range-btn" data-range="300" onclick="setTimeWindow(300)">5m</button>
    <button class="time-range-btn" data-range="900" onclick="setTimeWindow(900)">15m</button>
    <button class="time-range-btn" data-range="3600" onclick="setTimeWindow(3600)">1h</button>
  </div>
  <div id="graph"></div>

  <dialog id="dialog">
    <header>Error</header>
    <form method="dialog">
      <p id="dialogError"></p>
      <menu>
        <button value="">Close</button>
      </menu>
    </form>
  </dialog>

  <footer style="text-align: right;">
    <a target="_blank" href="https://github.com/ZDAVanO/usb-meter">Source Code</a>
  </footer>
  <script src="https://cdn.plot.ly/plotly-2.14.0.min.js" defer></script>
  <script src="./js/storage.js" defer></script>
  <script src="./js/meter.js" defer></script>
  <script src="./js/script.js" defer></script>

</body>

</html>
